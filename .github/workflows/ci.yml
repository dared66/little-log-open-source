name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private files and live-test settings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_public_source.py --base "$BASE_SHA"
      - name: Install verified secret scanner
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan current source and all new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir "$RUNNER_TEMP/public-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/public-source" --redact --ignore-gitleaks-allow
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            range="$BASE_SHA..HEAD"
          else
            range=HEAD
          fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --redact --ignore-gitleaks-allow
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Preserve compatibility with externally released build 54
        run: python3 scripts/check_build54_compatibility.py
      - run: flutter analyze
      - run: flutter test
      - name: Test production OAuth migration with actual public client definitions
        run: flutter test test/google_project_migration_test.dart test/google_auth_lifecycle_test.dart --dart-define-from-file=config/google.production.json
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: flutter build apk --debug --no-pub
